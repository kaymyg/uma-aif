[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uma-aif"
version = "0.2.0"
description = "Sampling-based internal-state auditing for transformer activations"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/kaymyg/uma-aif"
Related = "https://github.com/kaymyg/ames"

[tool.setuptools]
packages = ["uma_aif"]

[tool.pytest.ini_options]
testpaths = ["tests"]
